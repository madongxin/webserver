name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  lowlevel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake protobuf-compiler libprotobuf-dev \
            libssl-dev libjsoncpp-dev libhiredis-dev libmysqlclient-dev \
            libgflags-dev libleveldb-dev zlib1g-dev shellcheck
      - name: check_deps lowlevel
        run: ./scripts/check_deps.sh --lowlevel
      - name: bootstrap config
        run: ./scripts/bootstrap_local_config.sh
      - name: build Debug lowlevel
        run: ./scripts/build.sh Debug --lowlevel
      - name: test lowlevel
        run: ./scripts/test.sh lowlevel
      - name: git diff --check
        run: |
          git diff --check
          git diff --cached --check || true
      - name: shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n deploy/docker-entrypoint.sh
      - name: shellcheck
        run: shellcheck -x scripts/*.sh deploy/docker-entrypoint.sh

  full:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake protobuf-compiler libprotobuf-dev \
            libssl-dev libjsoncpp-dev libhiredis-dev libmysqlclient-dev \
            libgflags-dev libleveldb-dev zlib1g-dev shellcheck
          if [[ ! -f /usr/local/include/brpc/server.h && ! -f /usr/include/brpc/server.h ]]; then
            echo "ERROR: full CI requires brpc. Use a toolchain image or scripts/install_deps.sh --build-brpc." >&2
            exit 1
          fi
      - name: check_deps full
        run: ./scripts/check_deps.sh --full
      - name: bootstrap config
        run: ./scripts/bootstrap_local_config.sh
      - name: git diff --check
        run: git diff --check
      - name: build Debug
        run: ./scripts/build.sh Debug
      - name: build Release
        run: ./scripts/build.sh Release
      - name: unit
        run: ./scripts/test.sh unit
      - name: reactor
        run: ./scripts/test_reactor.sh
      - name: integration (redis)
        run: ./scripts/test_integration.sh
      - name: compose config
        run: docker compose -f compose.yml config >/dev/null
      - name: sanitizers
        run: ./scripts/test_sanitizers.sh all
      - name: shellcheck
        run: shellcheck -x scripts/*.sh deploy/docker-entrypoint.sh
