# 可选开发依赖：etcd + NATS（代码不强制）
# 用法：docker compose -f deploy/compose.dev.yml up -d
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --enable-v2=true
    ports:
      - "2379:2379"
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
