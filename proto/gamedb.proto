syntax = "proto3";

package gdb;

option cc_generic_services = true;

message GrantedItem {
  uint64 asset_id = 1;
  uint32 count = 2;
}

message BagEntry {
  uint32 item_id = 1;
  uint32 count = 2;
}

message ClaimMailReq {
  uint64 player_id = 1;
  uint64 mail_id = 2;
  string idempotency_key = 3;
  string trace_id = 4;
  int64 inventory_soft_cap = 5;
  repeated BagEntry bag_snapshot = 6;
}

message ClaimMailRsp {
  bool ok = 1;
  bool idempotent_hit = 2;
  bool should_apply_memory = 3;
  string error_code = 4;
  string message = 5;
  string attachment_state = 6;
  int64 mail_row_version = 7;
  repeated GrantedItem grants = 8;
  /** 本次领取事务提交后的正式资产版本（幂等命中返回当时已提交版本） */
  uint64 asset_version = 9;
}

message LookupAccountReq {
  uint64 player_id = 1;
  string device_id = 2;
}

message LookupAccountRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool exists = 4;
  bool banned = 5;
  uint64 account_id = 6;
  uint64 player_id = 7;
  string password_hash = 8;
  string password_salt = 9;
  int32 password_iters = 10;
  bool has_password = 11;
}

message RegisterAccountReq {
  string device_id = 1;
  string display_name = 2;
  string password_hash = 3;
  string password_salt = 4;
  int32 password_iters = 5;
  string idempotency_key = 6;
}

message RegisterAccountRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 account_id = 4;
  uint64 player_id = 5;
}

message LoadPlayerReq {
  uint64 player_id = 1;
}

message LoadPlayerRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 player_id = 4;
  uint64 asset_version = 5;
  bool exists = 6;
}

message LoadInventoryReq {
  uint64 player_id = 1;
}

message LoadInventoryRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 player_id = 4;
  uint64 asset_version = 5;
  repeated BagEntry bag = 6;
}

message AssetMutationReq {
  uint64 player_id = 1;
  string idempotency_key = 2;
  uint64 expected_version = 3;  // 0=不校验
  string mutation_type = 4;     // GRANT / CONSUME
  uint32 item_id = 5;
  uint32 count = 6;
  string trace_id = 7;
}

message AssetMutationRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool idempotent_hit = 4;
  uint64 asset_version = 5;
  uint32 remain_count = 6;
}

message SavePlayerSnapshotReq {
  uint64 player_id = 1;
  uint64 expected_version = 2;
  repeated BagEntry bag = 3;
  string idempotency_key = 4;
}

message SavePlayerSnapshotRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 asset_version = 4;
  bool idempotent_hit = 5;
}

message FlushPlayerReq {
  uint64 player_id = 1;
  string reason = 2;
}

message FlushPlayerRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 asset_version = 4;
}

message QueryOperationResultReq {
  uint64 player_id = 1;
  string idempotency_key = 2;
  string operation_type = 3;  // GRANT|CONSUME|SAVE_SNAPSHOT|CLAIM_MAIL|...
}

message QueryOperationResultRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool found = 4;
  bool completed_ok = 5;
  bool idempotent_hit = 6;
  uint64 asset_version = 7;
  uint32 remain_count = 8;
  string request_hash = 9;
  /** NOT_FOUND | IN_PROGRESS | SUCCEEDED | FAILED（兼容旧客户端：仍填 found/completed_ok） */
  string status = 10;
}

service GameDbService {
  rpc ClaimMailAttachments(ClaimMailReq) returns (ClaimMailRsp);
  /** Auth 账号查询（持久化层；不经 GameLogic） */
  rpc LookupAccount(LookupAccountReq) returns (LookupAccountRsp);
  rpc RegisterAccount(RegisterAccountReq) returns (RegisterAccountRsp);

  rpc LoadPlayer(LoadPlayerReq) returns (LoadPlayerRsp);
  rpc LoadInventory(LoadInventoryReq) returns (LoadInventoryRsp);
  rpc ApplyAssetMutation(AssetMutationReq) returns (AssetMutationRsp);
  rpc SavePlayerSnapshot(SavePlayerSnapshotReq) returns (SavePlayerSnapshotRsp);
  rpc FlushPlayer(FlushPlayerReq) returns (FlushPlayerRsp);
  rpc QueryOperationResult(QueryOperationResultReq) returns (QueryOperationResultRsp);
}
