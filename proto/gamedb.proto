syntax = "proto3";

package gdb;

option cc_generic_services = true;

message GrantedItem {
  uint64 asset_id = 1;
  uint32 count = 2;
}

message BagEntry {
  uint32 item_id = 1;
  uint32 count = 2;
}

message ClaimMailReq {
  uint64 player_id = 1;
  uint64 mail_id = 2;
  string idempotency_key = 3;
  string trace_id = 4;
  int64 inventory_soft_cap = 5;
  repeated BagEntry bag_snapshot = 6;
}

message ClaimMailRsp {
  bool ok = 1;
  bool idempotent_hit = 2;
  bool should_apply_memory = 3;
  string error_code = 4;
  string message = 5;
  string attachment_state = 6;
  int64 mail_row_version = 7;
  repeated GrantedItem grants = 8;
  /** 本次领取事务提交后的正式资产版本（幂等命中返回当时已提交版本） */
  uint64 asset_version = 9;
}

message LookupAccountReq {
  uint64 player_id = 1;
  string device_id = 2;
}

message LookupAccountRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool exists = 4;
  bool banned = 5;
  uint64 account_id = 6;
  uint64 player_id = 7;
  string password_hash = 8;
  string password_salt = 9;
  int32 password_iters = 10;
  bool has_password = 11;
}

message RegisterAccountReq {
  string device_id = 1;
  string display_name = 2;
  string password_hash = 3;
  string password_salt = 4;
  int32 password_iters = 5;
  string idempotency_key = 6;
}

message RegisterAccountRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 account_id = 4;
  uint64 player_id = 5;
}

message LoadPlayerReq {
  uint64 player_id = 1;
}

message LoadPlayerRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 player_id = 4;
  uint64 asset_version = 5;
  bool exists = 6;
}

message LoadInventoryReq {
  uint64 player_id = 1;
}

message LoadInventoryRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 player_id = 4;
  uint64 asset_version = 5;
  repeated BagEntry bag = 6;
}

message AssetMutationReq {
  uint64 player_id = 1;
  string idempotency_key = 2;
  uint64 expected_version = 3;  // 0=不校验
  string mutation_type = 4;     // GRANT / CONSUME
  uint32 item_id = 5;
  uint32 count = 6;
  string trace_id = 7;
}

message AssetMutationRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool idempotent_hit = 4;
  uint64 asset_version = 5;
  uint32 remain_count = 6;
}

message SavePlayerSnapshotReq {
  uint64 player_id = 1;
  uint64 expected_version = 2;
  repeated BagEntry bag = 3;
  string idempotency_key = 4;
}

message SavePlayerSnapshotRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 asset_version = 4;
  bool idempotent_hit = 5;
}

message FlushPlayerReq {
  uint64 player_id = 1;
  string reason = 2;
}

message FlushPlayerRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 asset_version = 4;
}

message PlayerProfile {
  uint64 player_id = 1;
  string player_name = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  int32 mp = 5;
  int32 max_mp = 6;
  int32 attack = 7;
  int32 spell_power = 8;
  int32 defense = 9;
  int32 magic_resistance = 10;
  float crit_chance = 11;
  float crit_damage = 12;
  float move_speed = 13;
  float attack_speed = 14;
  uint64 stats_version = 15;
}

message LoadPlayerProfileReq {
  uint64 player_id = 1;
  bool ensure_default = 2;  // 老账号缺档时幂等补默认 Profile
}

message LoadPlayerProfileRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool exists = 4;
  PlayerProfile profile = 5;
}

message SavePlayerProfileReq {
  PlayerProfile profile = 1;
  uint64 expected_stats_version = 2;  // 0=不校验
}

message SavePlayerProfileRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 stats_version = 4;
}

message QueryOperationResultReq {
  uint64 player_id = 1;
  string idempotency_key = 2;
  string operation_type = 3;  // GRANT|CONSUME|SAVE_SNAPSHOT|CLAIM_MAIL|...
}

message QueryOperationResultRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool found = 4;
  bool completed_ok = 5;
  bool idempotent_hit = 6;
  uint64 asset_version = 7;
  uint32 remain_count = 8;
  string request_hash = 9;
  /** NOT_FOUND | IN_PROGRESS | SUCCEEDED | FAILED（兼容旧客户端：仍填 found/completed_ok） */
  string status = 10;
}

service GameDbService {
  rpc ClaimMailAttachments(ClaimMailReq) returns (ClaimMailRsp);
  /** Auth 账号查询（持久化层；不经 GameLogic） */
  rpc LookupAccount(LookupAccountReq) returns (LookupAccountRsp);
  rpc RegisterAccount(RegisterAccountReq) returns (RegisterAccountRsp);

  rpc LoadPlayer(LoadPlayerReq) returns (LoadPlayerRsp);
  rpc LoadInventory(LoadInventoryReq) returns (LoadInventoryRsp);
  rpc ApplyAssetMutation(AssetMutationReq) returns (AssetMutationRsp);
  rpc SavePlayerSnapshot(SavePlayerSnapshotReq) returns (SavePlayerSnapshotRsp);
  rpc FlushPlayer(FlushPlayerReq) returns (FlushPlayerRsp);
  rpc QueryOperationResult(QueryOperationResultReq) returns (QueryOperationResultRsp);
  rpc LoadPlayerProfile(LoadPlayerProfileReq) returns (LoadPlayerProfileRsp);
  rpc SavePlayerProfile(SavePlayerProfileReq) returns (SavePlayerProfileRsp);
  rpc LoadLastSafePosition(LoadLastSafePositionReq) returns (LoadLastSafePositionRsp);
  rpc SaveLastSafePosition(SaveLastSafePositionReq) returns (SaveLastSafePositionRsp);
  rpc LoadPlayerBrief(LoadPlayerBriefReq) returns (LoadPlayerBriefRsp);

  /** World 在 Formal 下无 MySQL：邮件帧转 GameDB 执行 MailService */
  rpc HandleGameFrame(HandleGameFrameReq) returns (HandleGameFrameRsp);
}

message LastSafePosition {
  uint64 player_id = 1;
  uint32 realm_id = 2;
  uint64 map_template_id = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float yaw = 7;
  uint64 position_version = 8;
  int64 updated_at_unix = 9;
}

message LoadLastSafePositionReq {
  uint64 player_id = 1;
}

message LoadLastSafePositionRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool exists = 4;
  LastSafePosition pos = 5;
}

message SaveLastSafePositionReq {
  LastSafePosition pos = 1;
  uint64 expected_position_version = 2;  // 0=不校验，自增
}

message SaveLastSafePositionRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 position_version = 4;
  bool skipped = 5;
}

message LoadPlayerBriefReq {
  uint64 player_id = 1;
  string player_name = 2;  // 精确名字；player_id 优先
}

message LoadPlayerBriefRsp {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool exists = 4;
  bool ambiguous = 5;
  uint64 player_id = 6;
  string player_name = 7;
  int32 max_hp = 8;
  int32 max_mp = 9;
}

message HandleGameFrameReq {
  uint64 player_id = 1;
  bytes request_payload = 2;
}

message HandleGameFrameRsp {
  bool ok = 1;
  string message = 2;
  bytes response_frame = 3;
}
