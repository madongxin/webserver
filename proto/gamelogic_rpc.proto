syntax = "proto3";

package glrpc;

option cc_generic_services = true;

// GameLogic 只处理已认证玩家与游戏命令；不接收账号密码或原始登录凭证。

message BindPlayerRequest {
  uint64 request_id = 1;
  uint64 player_id = 2;
  string session_id = 3;
  string fence_token = 4;
  string gamelogic_instance_id = 5;
  uint64 map_instance_id = 6;
  uint64 map_owner_epoch = 7;
  uint64 route_version = 8;
  string gateway_instance_id = 9;
  string idempotency_key = 10;
  string trace_context = 11;
  uint64 generation = 12;
  string transfer_id = 13;  // 非空=Prepare/转移 Bind，清除 frozen
}

message BindPlayerResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  // PlayerReady 摘要（兼容外网可再包装为 GameResponse）
  uint32 bag_item_kinds = 4;
  bytes profile_pb = 5;  // 序列化的 game.PlayerAttributes
}

message UnbindPlayerRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message UnbindPlayerResponse {
  bool ok = 1;
  string message = 2;
}

message FreezePlayerRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
  string transfer_id = 4;
  string reason = 5;
  string idempotency_key = 6;
}

message FreezePlayerResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
}

message BagItemEntry {
  uint32 item_id = 1;
  uint32 count = 2;
}

message SkillCdEntry {
  uint32 skill_id = 1;
  int64 cd_until_ms = 2;
}

message PlayerRuntimeState {
  repeated BagItemEntry bag = 1;
  repeated SkillCdEntry skill_cds = 2;
  uint64 last_client_seq = 3;
  uint64 asset_version = 4;
}

/** 跨 GameLogic 迁移快照（版本化 + checksum） */
message PlayerTransferSnapshot {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
  uint64 generation = 4;
  string source_gamelogic_id = 5;
  string target_gamelogic_id = 6;
  uint64 source_map_instance_id = 7;
  uint64 target_map_instance_id = 8;
  uint64 target_owner_epoch = 9;
  uint64 route_version = 10;
  uint64 snapshot_version = 11;
  PlayerRuntimeState state = 12;
  string checksum = 13;
  string transfer_id = 14;
}

message ExportPlayerSnapshotRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
  string transfer_id = 4;
  string target_gamelogic_id = 5;
  uint64 target_map_instance_id = 6;
  uint64 target_owner_epoch = 7;
  string idempotency_key = 8;
}

message ExportPlayerSnapshotResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  PlayerTransferSnapshot snapshot = 4;
}

message ImportPlayerSnapshotRequest {
  PlayerTransferSnapshot snapshot = 1;
  string idempotency_key = 2;
}

message ImportPlayerSnapshotResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bool already_applied = 4;
}

message ClientCommand {
  uint64 request_id = 1;
  uint64 player_id = 2;
  string session_id = 3;
  string fence_token = 4;
  string gamelogic_instance_id = 5;
  uint64 map_instance_id = 6;
  uint64 map_owner_epoch = 7;
  uint64 client_seq = 8;
  string message_type = 9;
  bytes payload = 10;          // 通常为 game.GameRequest 去头序列化体
  string trace_context = 11;
  string idempotency_key = 12;
  uint64 generation = 13;
  uint64 route_version = 14;
  int32 deadline_ms = 15;
  string trace_id = 16;
}

message CommandResult {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  bytes response_frame = 4;    // [len][GameResponse]，Gateway 可直送客户端
  uint64 server_seq = 5;
}

service GameLogicService {
  rpc BindPlayer(BindPlayerRequest) returns (BindPlayerResponse);
  rpc Dispatch(ClientCommand) returns (CommandResult);
  rpc UnbindPlayer(UnbindPlayerRequest) returns (UnbindPlayerResponse);
  rpc FreezePlayer(FreezePlayerRequest) returns (FreezePlayerResponse);
  rpc ExportPlayerSnapshot(ExportPlayerSnapshotRequest) returns (ExportPlayerSnapshotResponse);
  rpc ImportPlayerSnapshot(ImportPlayerSnapshotRequest) returns (ImportPlayerSnapshotResponse);
}
