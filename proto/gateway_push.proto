syntax = "proto3";

package gwpush;

option cc_generic_services = true;

// GameLogic → Gateway 主动推送；Gateway 按 session_id 查当前连接，不依赖旧 connection_id。

message PushMessage {
  uint64 player_id = 1;
  string session_id = 2;
  uint64 server_seq = 3;
  string message_type = 4;
  bytes payload = 5;       // 通常已是外网帧或 GameResponse body
  bool reliable = 6;
  bool coalescable = 7;
  string fence_token = 8;  // 可选：与 Gateway 本地绑定校验
  uint64 generation = 9;
}

message PushBatchRequest {
  string gateway_instance_id = 1;
  repeated PushMessage messages = 2;
}

// 低基数。指标标签只用这些名字，不要带 player_id / session。
enum PushRejectReason {
  PUSH_OK = 0;
  NO_SESSION = 1;
  PLAYER_ID_MISMATCH = 2;
  GATEWAY_MISMATCH = 3;
  FENCE_MISMATCH = 4;
  GENERATION_MISMATCH = 5;
  SEQ_ALLOCATION_FAILED = 6;
  BAD_FRAME = 7;
  SEND_FAILED = 8;
  CLOSED = 9;
  // 可靠序号已经写入回放，这一帧没有进入发送缓冲。不得回滚序号。
  REPLAY_PENDING = 10;
}

message PushItemResult {
  uint64 player_id = 1;
  uint64 server_seq = 2;
  // true：进了应用发送缓冲或移动合并槽。不是内核写完，也不是客户端已应用。
  bool queued = 3;
  PushRejectReason reason = 4;
  bool replay_pending = 5;
}

message PushBatchResponse {
  bool ok = 1;
  string message = 2;
  uint32 accepted = 3;
  uint32 rejected = 4;
  repeated PushItemResult results = 5;
}

message KickConnectionRequest {
  uint64 player_id = 1;
  string session_id = 2;
  uint64 generation = 3;  // 只关闭该 generation 的旧连接
  string reason = 4;
}

message KickConnectionResponse {
  bool ok = 1;
  string message = 2;
  bool closed = 3;
}

service GatewayPushService {
  rpc PushBatch(PushBatchRequest) returns (PushBatchResponse);
  rpc KickConnection(KickConnectionRequest) returns (KickConnectionResponse);
}
