syntax = "proto3";

package sess;

option cc_generic_services = true;

import "game.proto";

// Session/Router：在线会话、顶号、Gateway 绑定、断线重连与 Logic 路由。
// Auth 负责认证；Session 不接收账号密码。

message ValidateTokenReq {
  uint64 player_id = 1;
  string token = 2;  // fence_token
}

message ValidateTokenRsp {
  bool ok = 1;
  string message = 2;
}

message BindConnectionReq {
  uint64 player_id = 1;
  string token = 2;
  string gateway_id = 3;
  uint64 connection_id = 4;
}

message BindConnectionRsp {
  bool ok = 1;
  string message = 2;
}

message MarkDisconnectedReq {
  uint64 player_id = 1;
  string token = 2;
  uint64 generation = 3;
}

message MarkDisconnectedRsp {
  bool ok = 1;
  string message = 2;
}

message AcquireSessionRequest {
  uint64 account_id = 1;
  uint64 player_id = 2;
  string device_id = 3;
  uint32 server_id = 4;
  uint32 ttl_sec = 5;
  bool kick_other_device = 6;
  string gateway_instance_id = 7;
  // 可选：由 Gateway/Registry 建议的 Logic；空则 Session 按 player_id % N 分配
  string preferred_gamelogic_instance_id = 8;
}

message AcquireSessionResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  string session_id = 4;
  string fence_token = 5;
  uint64 generation = 6;
  string gamelogic_instance_id = 7;
  uint64 map_instance_id = 8;
  uint64 map_owner_epoch = 9;
  uint64 route_version = 10;
  bool kicked_previous = 11;
  int64 login_time_sec = 12;
  uint32 server_id = 13;
}

message MarkDisconnectedRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
  uint64 generation = 4;
}

message MarkDisconnectedResponse {
  bool ok = 1;
  string message = 2;
}

message ReconnectRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string reconnect_ticket = 3;  // 通常为旧 fence_token
  string gateway_instance_id = 4;
  uint64 last_server_seq = 5;
}

message ReconnectResponse {
  bool ok = 1;
  string message = 2;
  string session_id = 3;
  string fence_token = 4;
  uint64 generation = 5;
  string gamelogic_instance_id = 6;
  uint64 map_instance_id = 7;
  uint64 map_owner_epoch = 8;
  uint64 route_version = 9;
}

message LogoutRequest {
  uint64 player_id = 1;
  string session_id = 2;
  string fence_token = 3;
}

message LogoutResponse {
  bool ok = 1;
  string message = 2;
}

message KickRequest {
  uint64 player_id = 1;
  string reason = 2;
}

message KickResponse {
  bool ok = 1;
  string message = 2;
}

// --- Placement（阶段 2；模块在 Session 进程，边界清晰可拆）---
message PlacementRecord {
  uint32 realm_id = 1;
  uint64 map_template_id = 2;
  uint64 map_instance_id = 3;
  string owner_logic_server_id = 4;
  uint64 owner_epoch = 5;
  uint64 route_version = 6;
  string state = 7;  // CREATING/READY/FROZEN/MIGRATING/RECOVERING/CLOSED
  int64 updated_at = 8;
  int64 lease_until = 9;
}

message ResolveOrCreateMapRequest {
  uint32 realm_id = 1;
  uint64 map_template_id = 2;
  uint64 map_instance_id = 3;  // 0=按 realm+template 解析/创建权威实例
  string preferred_owner = 4;
  bool force_new = 5;          // true=总是新建独立实例（不走 template 索引）
}

message ResolveOrCreateMapResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  PlacementRecord placement = 4;
}

message GetPlacementRequest {
  uint64 map_instance_id = 1;
}

message GetPlacementResponse {
  bool ok = 1;
  string message = 2;
  PlacementRecord placement = 3;
}

message MigrateMapRequest {
  uint64 map_instance_id = 1;
  string new_owner_logic_server_id = 2;
  string idempotency_key = 3;
  uint64 expect_epoch = 4;  // 0=不校验
}

message MigrateMapResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  PlacementRecord placement = 4;
}

message MarkRecoveringRequest {
  uint64 map_instance_id = 1;
  string reason = 2;
}

message MarkRecoveringResponse {
  bool ok = 1;
  string message = 2;
  PlacementRecord placement = 3;
}

message HeartbeatOwnerRequest {
  uint64 map_instance_id = 1;
  string owner_logic_server_id = 2;
  uint64 owner_epoch = 3;
  uint32 lease_sec = 4;
}

message HeartbeatOwnerResponse {
  bool ok = 1;
  string message = 2;
  int64 lease_until = 3;
}

message UpdatePlayerRouteRequest {
  uint64 player_id = 1;
  string fence_token = 2;
  string gamelogic_instance_id = 3;
  uint64 map_instance_id = 4;
  uint64 map_owner_epoch = 5;
  uint64 route_version = 6;  // 期望新版本；0=自动 +1
  string gateway_instance_id = 7;
  string push_endpoint = 8;
}

message UpdatePlayerRouteResponse {
  bool ok = 1;
  string message = 2;
  uint64 route_version = 3;
}

// 跨 GameLogic 玩家转移（EnterMap 等）
message BeginPlayerTransferRequest {
  uint64 player_id = 1;
  string fence_token = 2;
  uint64 expected_route_version = 3;  // CAS；0=接受当前
  string from_gamelogic_instance_id = 4;
  string to_gamelogic_instance_id = 5;
  uint64 map_instance_id = 6;
  uint64 map_owner_epoch = 7;
  string transfer_id = 8;             // 空则服务端生成；重试幂等
  string gateway_instance_id = 9;
}

message BeginPlayerTransferResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  string transfer_id = 4;
  uint64 route_version = 5;           // 仍为 Begin 前版本；Commit 后递增
  string route_state = 6;             // TRANSFERRING
}

message CommitPlayerTransferRequest {
  uint64 player_id = 1;
  string fence_token = 2;
  string transfer_id = 3;
  string to_gamelogic_instance_id = 4;
  uint64 map_instance_id = 5;
  uint64 map_owner_epoch = 6;
  string gateway_instance_id = 7;
}

message CommitPlayerTransferResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 route_version = 4;
  string gamelogic_instance_id = 5;
  uint64 map_instance_id = 6;
  uint64 map_owner_epoch = 7;
  string route_state = 8;
}

message AbortPlayerTransferRequest {
  uint64 player_id = 1;
  string fence_token = 2;
  string transfer_id = 3;
  string reason = 4;
}

message AbortPlayerTransferResponse {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
  uint64 route_version = 4;
  string route_state = 5;
}

message GetPlayerRouteRequest {
  uint64 player_id = 1;
  string fence_token = 2;
}

message GetPlayerRouteResponse {
  bool ok = 1;
  string message = 2;
  string session_id = 3;
  string fence_token = 4;
  uint64 generation = 5;
  string gateway_instance_id = 6;
  string gamelogic_instance_id = 7;
  uint64 map_instance_id = 8;
  uint64 map_owner_epoch = 9;
  uint64 route_version = 10;
  string route_state = 11;
  string transfer_id = 12;
}

service SessionService {
  // --- 新边界（Gateway 编排）---
  rpc AcquireSession(AcquireSessionRequest) returns (AcquireSessionResponse);
  rpc MarkDisconnectedV2(MarkDisconnectedRequest) returns (MarkDisconnectedResponse);
  rpc ReconnectV2(ReconnectRequest) returns (ReconnectResponse);
  rpc LogoutV2(LogoutRequest) returns (LogoutResponse);
  rpc Kick(KickRequest) returns (KickResponse);

  // --- Placement ---
  rpc ResolveOrCreateMap(ResolveOrCreateMapRequest) returns (ResolveOrCreateMapResponse);
  rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse);
  rpc MigrateMap(MigrateMapRequest) returns (MigrateMapResponse);
  rpc MarkRecovering(MarkRecoveringRequest) returns (MarkRecoveringResponse);
  rpc HeartbeatOwner(HeartbeatOwnerRequest) returns (HeartbeatOwnerResponse);
  rpc UpdatePlayerRoute(UpdatePlayerRouteRequest) returns (UpdatePlayerRouteResponse);
  rpc BeginPlayerTransfer(BeginPlayerTransferRequest) returns (BeginPlayerTransferResponse);
  rpc CommitPlayerTransfer(CommitPlayerTransferRequest) returns (CommitPlayerTransferResponse);
  rpc AbortPlayerTransfer(AbortPlayerTransferRequest) returns (AbortPlayerTransferResponse);
  rpc GetPlayerRoute(GetPlayerRouteRequest) returns (GetPlayerRouteResponse);

  // --- 兼容旧 RPC（内部转调；GameLogic 不应再调 Login）---
  rpc Login(game.LoginReq) returns (game.LoginRsp);
  rpc Reconnect(game.ReconnectReq) returns (game.ReconnectRsp);
  rpc Logout(game.LogoutReq) returns (game.LogoutRsp);
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenRsp);
  rpc BindConnection(BindConnectionReq) returns (BindConnectionRsp);
  rpc MarkDisconnected(MarkDisconnectedReq) returns (MarkDisconnectedRsp);
}
